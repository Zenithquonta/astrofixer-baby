name: Android APK

# Builds the Android app from its saved history (handoff/astrofixxer-android.bundle), runs its tests, and publishes
# AstroFixxer.apk as a GitHub Release, so anyone can download it from this public repository:
# https://github.com/Zenithquonta/astrofixer-baby/releases/download/android-latest/AstroFixxer.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the Android app
        run: git clone --branch main handoff/astrofixxer-android.bundle android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # With the PREVIEW_KEYSTORE_BASE64 / PREVIEW_KEYSTORE_PASSWORD secrets, the APK is signed with the permanent private key,
      # so each download installs over the last. Without them it is signed with the throwaway debug key Gradle creates on this
      # runner: still private and never reused, but a newer build then needs the old one uninstalled first.
      - name: Restore signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo "$PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
            echo "ASTROFIXXER_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PREVIEW_KEYSTORE_BASE64 is not set: publishing an APK signed with this run's throwaway debug key."
          fi
      - name: Test and build the APK
        working-directory: android
        env:
          ASTROFIXXER_PREVIEW_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
        run: ./gradlew test assemblePreview
      # The app can't start without its data: fail if the packaged APK is missing any of it.
      - name: Check the APK carries the sky data
        run: |
          for f in assets/sky_catalog.json assets/minor_bodies.json assets/meteor_showers.json assets/art/modern/ assets/art/indian/; do
            unzip -l android/app/build/outputs/apk/preview/app-preview.apk | grep -q " $f" || { echo "::error::$f is missing from the APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AstroFixxer-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - name: Publish AstroFixxer.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/preview/app-preview.apk AstroFixxer.apk
          commit=$(git -C android rev-parse --short HEAD)
          if [ -n "$ASTROFIXXER_PREVIEW_KEYSTORE" ]; then
            update="New builds install over the old one and keep your lists."
          else
            update="Each build is signed with a new one-off key, so uninstall the old AstroFixxer before installing a newer one."
          fi
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest AstroFixxer.apk --latest --target "$GITHUB_SHA" \
            --title "AstroFixxer for Android" \
            --notes "Built and tested automatically from Android commit $commit.

          **Install:** on an Android 8+ phone, tap **AstroFixxer.apk** below, open the downloaded file, and allow installing unknown apps if asked. $update

          What changed: see [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CHANGELOG.md)."

  # Fails the build if a key, token or password is committed.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
