name: Android APK

# Builds the Android app from its saved history (handoff/astrofixxer-android.bundle), runs its tests, and publishes
# AstroFixxer.apk as a GitHub Release, so anyone can download it from this public repository:
# https://github.com/Zenithquonta/astrofixer-baby/releases/download/android-latest/AstroFixxer.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the Android app
        run: git clone --branch main handoff/astrofixxer-android.bundle android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The signing key lives only in the PREVIEW_KEYSTORE_BASE64 / PREVIEW_KEYSTORE_PASSWORD secrets. Without them the app is
      # still built and tested, but nothing is published, so the public download is always signed with the same private key.
      - name: Restore signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo "$PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
            echo "ASTROFIXXER_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PREVIEW_KEYSTORE_BASE64 is not set, so the APK is built and tested but not published."
          fi
      - name: Test and build the APK
        working-directory: android
        env:
          ASTROFIXXER_PREVIEW_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
        run: ./gradlew test assemblePreview
      - uses: actions/upload-artifact@v4
        with:
          name: AstroFixxer-apk
          path: android/app/build/outputs/apk/preview/app-preview.apk
      - name: Publish AstroFixxer.apk
        if: env.ASTROFIXXER_PREVIEW_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/preview/app-preview.apk AstroFixxer.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest AstroFixxer.apk --prerelease --target "$GITHUB_SHA" \
            --title "AstroFixxer for Android (latest build)" \
            --notes "Built from Android commit $(git -C android rev-parse --short HEAD). On an Android 8+ phone, tap AstroFixxer.apk, open it, and allow installing unknown apps if asked. New builds install over the old one."

  # Fails the build if a key, token or password is committed.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
